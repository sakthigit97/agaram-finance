service: agaram-finance-api
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, 'ap-south-2'}
  stage: ${opt:stage, 'dev'}
  httpApi:
    cors:
      allowedOrigins:
        - ${env:ALLOWED_ORIGIN}
      allowedHeaders:
        - Content-Type
        - Authorization
        - Idempotency-Key
      allowedMethods:
        - GET
        - POST
        - PATCH
        - DELETE
      maxAge: 600
  logs:
    httpApi: true
  environment:
    STAGE: ${sls:stage}
    SERVICE_NAME: agaram-finance-api
    TABLE_NAME: !Ref FinanceTable
    BUSINESS_ID: ${env:BUSINESS_ID, 'default'}
    JWT_SECRET_PARAMETER_NAME: /agaram-finance/${sls:stage}/JWT_SECRET
    PHONE_LOOKUP_SECRET_PARAMETER_NAME: /agaram-finance/${sls:stage}/PHONE_LOOKUP_SECRET
  timeout: 15
  memorySize: 256
  iam:
    role:
      statements: []

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: true
    target: node22
    platform: node
    format: cjs

functions:
  api:
    handler: src/handlers/api.handler
    description: Agaram Finance API router
    events:
      - httpApi:
          method: ANY
          path: /
      - httpApi:
          method: ANY
          path: /{proxy+}

resources:
  Resources:
    FinanceTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: agaram-finance-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
          - AttributeName: GSI2PK
            AttributeType: S
          - AttributeName: GSI2SK
            AttributeType: S
          - AttributeName: GSI3PK
            AttributeType: S
          - AttributeName: GSI3SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: GSI1
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: GSI2
            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH
              - AttributeName: GSI2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: GSI3
            KeySchema:
              - AttributeName: GSI3PK
                KeyType: HASH
              - AttributeName: GSI3SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        SSESpecification:
          SSEEnabled: true
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true
    FinanceApiRolePolicy:
      Type: AWS::IAM::Policy
      Properties:
        PolicyName: agaram-finance-table-access
        Roles:
          - !Ref IamRoleLambdaExecution
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:TransactWriteItems
                - dynamodb:ConditionCheckItem
              Resource:
                - !GetAtt FinanceTable.Arn
                - !Sub '${FinanceTable.Arn}/index/*'
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/agaram-finance/${sls:stage}/JWT_SECRET'
                - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/agaram-finance/${sls:stage}/PHONE_LOOKUP_SECRET'
  Outputs:
    ApiBaseUrl:
      Description: HTTP API base URL
      Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    FinanceTableName:
      Description: DynamoDB finance table
      Value: !Ref FinanceTable

package:
  individually: true
  patterns:
    - '!tests/**'
